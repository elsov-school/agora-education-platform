{% extends 'base.html' %}
{% block title %}{{ 'Editar' if material else 'Novo' }} material{% endblock %}
{% block content %}
<header class="page-header compact"><div><a class="back-link" href="{{ url_for('library') }}">← Biblioteca</a><h1>{{ 'Editar material' if material else 'Adicionar material' }}</h1><p>Registre os metadados e o conteúdo que servirá de fonte institucional.</p></div></header>
<form method="post" class="card form-card">
  <div class="form-grid"><label class="span-2">Título<input required name="title" value="{{ material.title if material else '' }}"></label><label>Tipo do material<input required name="material_type" value="{{ material.material_type if material else '' }}" placeholder="Apostila, vídeo, texto..."></label><label>Ano letivo<input required type="number" name="school_year" value="{{ material.school_year if material else 2026 }}"></label><label>Série / turma<input required name="class_name" value="{{ material.class_name if material else '' }}" placeholder="8o ano A"></label><label>Disciplina<input required name="subject" value="{{ material.subject if material else '' }}"></label><label>Bimestre<select name="bimester">{% for n in range(1,5) %}<option value="{{ n }}" {{ 'selected' if material and material.bimester == n }}>{{ n }}º bimestre</option>{% endfor %}</select></label><label>Habilidade BNCC<input required name="bncc" value="{{ material.bncc if material else '' }}" placeholder="EF08MA04"></label><label class="span-2">Autor / fonte<input required name="author_source" value="{{ material.author_source if material else '' }}"></label><label>Status de aprovação<select name="approval_status">{% for status in ['Aprovado','Pendente','Reprovado'] %}<option {{ 'selected' if material and material.approval_status == status }}>{{ status }}</option>{% endfor %}</select></label><label class="span-3">Conteúdo ou descrição<textarea required name="content" rows="8" placeholder="Insira o conteúdo factual que poderá ser usado pelo gerador e pelo assistente.">{{ material.content if material else '' }}</textarea><small>O assistente e o gerador não utilizarão informações fora deste campo.</small></label></div>
  <div class="form-actions"><a class="button ghost" href="{{ url_for('library') }}">Cancelar</a><button class="button primary" type="submit">Salvar material</button></div>
</form>
{% endblock %}
